[project]
name = "ohho-drone"
version = "0.0.0"
description = "Experimental: PX4 SITL simulation and MAVLink adapter prototype for OhhO OS."
readme = "docs/README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Software prototype only — standard library based, optional ohho-os / pymavlink integration
dependencies = []

[project.urls]
Repository = "https://github.com/ohho-robotics/ohho-drone"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.backends.legacy:build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = []
