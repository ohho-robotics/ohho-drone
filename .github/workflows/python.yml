name: python

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: End-to-end regression smoke test
        run: python scripts/run_smoke_test.py
      - name: Hello-world mock verification
        run: python scripts/px4_sitl_hello.py --mock --timeout 3.0
